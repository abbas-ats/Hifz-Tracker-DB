<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Hifz Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f8f5;--card:#fff;--tx:#1d2a22;--mu:#6b7a70;--pr:#1f7a4d;--bd:#dfe6e0;--g:#3aa66a;--y:#e8b92f;--r:#d9534f;--n:#d5dbd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b241f;--tx:#e8efe9;--mu:#93a398;--bd:#2a362e;--n:#34413a}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b241f;--tx:#e8efe9;--mu:#93a398;--bd:#2a362e;--n:#34413a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.main{flex:1;overflow-y:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
input,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:5px 0}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff;cursor:pointer}
button.sec{background:var(--n);color:var(--tx)}
h2,h3{margin:4px 0 10px}.mu{color:var(--mu);font-size:14px}
nav{display:flex;border-top:1px solid var(--bd);background:var(--card)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 4px;font-size:14px}
nav button.on{color:var(--pr);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cell{padding:8px 0;font-size:13px;text-align:center;background:var(--n);color:var(--tx);border-radius:6px}
.cell.g{background:var(--g);color:#fff}.cell.y{background:var(--y);color:#222}.cell.r{background:var(--r);color:#fff}
.cell.s{outline:3px solid var(--tx)}.cell{touch-action:manipulation;user-select:none}
details{margin-bottom:8px}summary{padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;cursor:pointer}
.leg span{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px}
.bar{display:flex;gap:8px;align-items:center;padding:10px;background:var(--card);border-top:1px solid var(--bd)}
.msg{margin-bottom:10px}.msg b{font-size:14px}.msg.p div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;margin-top:2px}
.row{display:flex;gap:8px}.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chip{white-space:nowrap;background:var(--n);color:var(--tx);border-radius:20px;padding:6px 12px}.chip.on{background:var(--pr);color:#fff}
</style>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head><body><div id="app"></div>
<script>
// TODO: Replace the object below with your own Firebase project configuration credentials
const firebaseConfig = {
  apiKey: "AIzaSyDRNaNowelyLtpmf8xwbSpAHKsj3h3-ZlM",
  authDomain: "hifz-tracker-db.firebaseapp.com",
  projectId: "hifz-tracker-db",
  storageBucket: "hifz-tracker-db.firebasestorage.app",
  messagingSenderId: "620272626965",
  appId: "1:620272626965:web:b1a4761b1eb8361917cd1c",
  measurementId: "G-PVXLVMD6SK"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=604,JUZ=[1,22,42,62,82,102,122,142,162,182,202,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];
const today=()=>new Date().toISOString().slice(0,10),days=d=>(Date.now()-Date.parse(d))/864e5;
let meId,me,viewUid,tab='tk',room=null,sel=new Set(),unsub=null,cache={};
const app=()=>$('#app');
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const getU=async id=>{if(!cache[id]){const s=await db.doc('users/'+id).get();cache[id]=s.exists?s.data():{name:id,color:'#888'}}return cache[id]};
const getP=async id=>{const s=await db.doc('prog/'+id).get();return s.exists?s.data():{pages:{},log:{}}};
const rid=(a,b)=>[a,b].sort().join('__');
const ranges=a=>{a=[...a].sort((x,y)=>x-y);let o=[],i=0;while(i<a.length){let j=i;while(a[j+1]==a[j]+1)j++;o.push(j>i?a[i]+'–'+a[j]:''+a[i]);i=j+1}return o.join(', ')};
const store={get(){try{return localStorage.getItem('hifz_me')}catch(e){return null}},set(v){try{v?localStorage.setItem('hifz_me',v):localStorage.removeItem('hifz_me')}catch(e){}}};

async function init(){
  const id=store.get();if(id){const s=await db.doc('users/'+id).get();if(s.exists){meId=id;me=s.data();return home()}}
  auth();
}
function auth(){
  app().innerHTML=`<div class="main"><h2>📖 Hifz Tracker</h2><p class="mu">Track jadeed &amp; murajaah with your Akh-al-Qurani.</p>
  <div class="card"><input id="i" placeholder="ID (letters/numbers)" autocapitalize="none"><input id="p" type="password" placeholder="Password">
  <input id="n" placeholder="Your name (only for new account)">
  <div class="row"><button id="si">Sign in</button><button id="su" class="sec">Create account</button></div><p id="e" class="mu"></p></div></div>`;
  const err=t=>$('#e').textContent=t,v=()=>[$('#i').value.trim().toLowerCase(),$('#p').value,$('#n').value.trim()];
  $('#si').onclick=async()=>{const[i,p]=v();if(!i||!p)return err('Enter ID and password');const s=await db.doc('users/'+i).get();
    if(!s.exists||s.data().pw!==await sha(i+':'+p))return err('Wrong ID or password');meId=i;me=s.data();store.set(i);home()};
  $('#su').onclick=async()=>{const[i,p,n]=v();if(!/^[a-z0-9_]{3,20}$/.test(i))return err('ID: 3–20 letters, numbers or _');
    if(p.length<4)return err('Password: at least 4 characters');if(!n)return err('Name is required');
    if((await db.doc('users/'+i).get()).exists)return err('ID already taken');
    const color='#'+[0,0,0].map(()=>(50+Math.random()*130|0).toString(16).padStart(2,'0')).join('');
    me={name:n,bio:'',insta:'',color,pw:await sha(i+':'+p),onb:false};await db.doc('users/'+i).set(me);await db.doc('prog/'+i).set({pages:{},log:{}});
    meId=i;store.set(i);home()};
}
function onboard(){
  app().innerHTML=`<div class="main"><h2>Bismillah, ${esc(me.name)}</h2><div class="card"><p>How many pages of the Quran have you already memorized? (Misri Quran, counted from page 1)</p>
  <input id="m" type="number" min="0" max="${T}" placeholder="e.g. 120"><p class="mu">Juz = ~20 pages. They'll be marked as revised today.</p><button id="go">Continue</button></div></div>`;
  $('#go').onclick=async()=>{const n=Math.max(0,Math.min(T,+$('#m').value||0)),pr=await getP(meId);
    for(let p=1;p<=n;p++)pr.pages[p]=today();await db.doc('prog/'+meId).set(pr);me.onb=true;await db.doc('users/'+meId).update({onb:true});home()};
}
function home(){if(!me.onb)return onboard();viewUid=meId;tab='tk';shell()}
function shell(){
  app().innerHTML=`<div class="main" id="mn"></div><div id="ab"></div><nav>${[['tk','📅 Takhteet'],['ch','💬 Chat'],['ak','🤝 Akhs'],['pf','👤 Profile']].map(([k,l])=>`<button data-t="${k}" class="${tab==k?'on':''}">${l}</button>`).join('')}</nav>`;
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(unsub){unsub();unsub=null}tab=b.dataset.t;if(tab=='tk'&&viewUid!=meId&&!b.dataset.keep)viewUid=meId;sel.clear();shell()});
  ({tk:takh,ch:chat,ak:akhs,pf:profile})[tab]();
}
async function takh(){
  const mn=$('#mn'),own=viewUid==meId,u=await getU(viewUid),pr=await getP(viewUid),t=today(),lg=pr.log[t]||{j:[],m:[]};
  const col=p=>{const d=pr.pages[p];if(!d)return'';const x=days(d);return x<30?'g':x<60?'y':'r'};
  let h=own?`<h3>My Takhteet</h3>`:`<h3 style="color:${u.color}">${esc(u.name)}'s Takhteet</h3><button class="sec" id="back">← Back to mine</button>`;
  h+=`<div class="card">Today: <b>${lg.j.length}</b> jadeed · <b>${lg.m.length}</b> murajaah<div class="mu leg"><span style="background:var(--g)"></span>&lt;1 month<span style="background:var(--y)"></span>1+ month<span style="background:var(--r)"></span>2+ months<span style="background:var(--n)"></span>none</div><div class="mu" style="margin-top:6px">Double-tap a page marked today to undo it.</div></div>`;
  JUZ.forEach((s,i)=>{const e=(JUZ[i+1]||T+1)-1;let c=0,cells='';for(let p=s;p<=e;p++){if(pr.pages[p])c++;cells+=`<div class="cell ${col(p)}${sel.has(p)?' s':''}" data-p="${p}" title="${pr.pages[p]||''}">${p}</div>`}
    h+=`<details${open_.has(i)?' open':''} data-j="${i}"><summary>Juz ${i+1} · p${s}–${e} · ${c}/${e-s+1}</summary><div class="grid">${cells}</div></details>`});
  mn.innerHTML=h;if($('#back'))$('#back').onclick=()=>{viewUid=meId;shell()};
  document.querySelectorAll('details').forEach(d=>d.ontoggle=()=>d.open?open_.add(+d.dataset.j):open_.delete(+d.dataset.j));
  if(!own)return;
  document.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{const p=+c.dataset.p;sel.has(p)?sel.delete(p):sel.add(p);c.classList.toggle('s');bar()});
  document.querySelectorAll('.cell').forEach(c=>c.ondblclick=()=>undo(+c.dataset.p));
  const bar=()=>{$('#ab').innerHTML=sel.size?`<div class="bar"><span>${sel.size} page${sel.size>1?'s':''}</span><button id="mj">Jadeed</button><button id="mm">Murajaah</button><button class="sec" id="cl">Clear</button></div>`:'';
    if(!sel.size)return;$('#cl').onclick=()=>{sel.clear();takh();bar()};$('#mj').onclick=()=>mark('j');$('#mm').onclick=()=>mark('m')};
  bar();
}
const open_=new Set();
async function undo(p){const t=today(),pr=await getP(meId),l=pr.log[t];
  if(!l||pr.pages[p]!==t||(!l.j.includes(p)&&!l.m.includes(p)))return;
  const pv=(l.prev||{})[p];if(pv)pr.pages[p]=pv;else delete pr.pages[p];
  l.j=l.j.filter(x=>x!=p);l.m=l.m.filter(x=>x!=p);if(l.prev)delete l.prev[p];
  await db.doc('prog/'+meId).set(pr);
  const a=await akhList();await Promise.all(a.map(id=>db.collection(`rooms/${rid(meId,id)}/msgs`).add({from:meId,text:`Undid page ${p}`,t:Date.now(),kind:'p'})));
  sel.delete(p);takh();}
async function mark(type){
  const ps=[...sel],t=today(),pr=await getP(meId);
  const l=pr.log[t]=pr.log[t]||{j:[],m:[]};l.prev=l.prev||{};ps.forEach(p=>{if(!(p in l.prev))l.prev[p]=pr.pages[p]||'';pr.pages[p]=t});l[type]=[...new Set([...l[type],...ps])];
  await db.doc('prog/'+meId).set(pr);
  const text=`${type=='j'?'Jadeed':'Murajaah'}: page${ps.length>1?'s':''} ${ranges(ps)}`;
  const a=await akhList();await Promise.all(a.map(id=>db.collection(`rooms/${rid(meId,id)}/msgs`).add({from:meId,text,t:Date.now(),kind:'p'})));
  sel.clear();$('#ab').innerHTML='';takh();
}
async function akhList(){
  const [a,b]=await Promise.all([db.collection('reqs').where('from','==',meId).get(),db.collection('reqs').where('to','==',meId).get()]);
  return[...a.docs,...b.docs].map(d=>d.data()).filter(r=>r.status=='ok').map(r=>r.from==meId?r.to:r.from);
}
async function chat(){
  const mn=$('#mn'),a=await akhList();
  if(!a.length){mn.innerHTML='<h3>Chat</h3><div class="card">No chat rooms yet. Go to <b>Akhs</b> and send a request.</div>';return}
  if(!room||!a.includes(room))room=a[0];
  const us=await Promise.all(a.map(getU));
  mn.innerHTML=`<div class="chips">${a.map((id,i)=>`<button class="chip${id==room?' on':''}" data-r="${id}">${esc(us[i].name)}</button>`).join('')}</div>
  <div class="row" style="margin-bottom:8px"><button class="sec" id="vt">View ${esc(cache[room].name)}'s takhteet</button></div><div id="ms" style="min-height:40vh"></div>
  <div class="row"><input id="tx" placeholder="Message…"><button id="sd">Send</button></div>`;
  mn.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{room=c.dataset.r;if(unsub)unsub();chat()});
  $('#vt').onclick=()=>{viewUid=room;tab='tk';sel.clear();shell()};
  const send=async()=>{const v=$('#tx').value.trim();if(!v)return;$('#tx').value='';await db.collection(`rooms/${rid(meId,room)}/msgs`).add({from:meId,text:v,t:Date.now(),kind:'c'})};
  $('#sd').onclick=send;$('#tx').onkeydown=e=>{if(e.key=='Enter')send()};
  if(unsub)unsub();
  unsub=db.collection(`rooms/${rid(meId,room)}/msgs`).orderBy('t','asc').limit(200).onSnapshot(async s=>{
    const ds=s.docs.map(d=>d.data());await Promise.all([...new Set(ds.map(d.from))].map(getU));
    const el=$('#ms');if(!el)return;
    el.innerHTML=ds.map(m=>{const u=cache[m.from];const d=new Date(m.t);return`<div class="msg ${m.kind}"><b style="color:${esc(u.color)}">${esc(u.name)}</b> <span class="mu">${d.toLocaleDateString([], {month:'short',day:'numeric'})} ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span><div>${m.kind=='p'?'📖 ':''}${esc(m.text)}</div></div>`}).join('')||'<p class="mu">No messages yet.</p>';
    $('#mn').scrollTop=$('#mn').scrollHeight;
  });
}
async function akhs(){
  const mn=$('#mn');
  const [a,b]=await Promise.all([db.collection('reqs').where('from','==',meId).get(),db.collection('reqs').where('to','==',meId).get()]);
  const all=[...a.docs,...b.docs],inc=all.filter(d=>d.data().to==meId&&d.data().status=='pending'),ok=all.filter(d=>d.data().status=='ok'),out=all.filter(d=>d.data().from==meId&&d.data().status=='pending');
  await Promise.all(all.map(d=>Promise.all([getU(d.data().from),getU(d.data().to)])));
  const nm=id=>`<b style="color:${esc(cache[id].color)}">${esc(cache[id].name)}</b> <span class="mu">@${esc(id)}</span>`;
  mn.innerHTML=`<h3>Akh-al-Qurani</h3><div class="card"><p>Request someone by their ID</p><div class="row"><input id="ri" placeholder="their ID" autocapitalize="none"><button id="rq">Request</button></div><p id="re" class="mu"></p></div>
  ${inc.length?`<h3>Requests for you</h3>${inc.map(d=>`<div class="card">${nm(d.data().from)}<div class="row" style="margin-top:8px"><button data-a="${d.id}">Accept</button><button class="sec" data-x="${d.id}">Decline</button></div></div>`).join('')}`:''}
  <h3>My Akhs</h3>${ok.map(d=>{const o=d.data().from==meId?d.data().to:d.data().from;return`<div class="card">${nm(o)}</div>`}).join('')||'<p class="mu">None yet.</p>'}
  ${out.length?`<p class="mu">Pending sent: ${out.map(d=>'@'+esc(d.data().to)).join(', ')}</p>`:''}`;
  $('#rq').onclick=async()=>{const i=$('#ri').value.trim().toLowerCase(),e=$('#re');if(!i||i==meId)return e.textContent='Enter another user\'s ID';
    if(!(await db.doc('users/'+i).get()).exists)return e.textContent='User not found';
    await db.doc('reqs/'+meId+'__'+i).set({from:meId,to:i,status:'pending'});akhs()};
  mn.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{await db.doc('reqs/'+b.dataset.a).update({status:'ok'});akhs()});
  mn.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{await db.doc('reqs/'+b.dataset.x).delete();akhs()});
}
function profile(){
  $('#mn').innerHTML=`<h3>Profile</h3><div class="card"><p>Your color: <b style="color:${esc(me.color)}">${esc(me.color)} ●</b></p>
  <input id="pn" placeholder="Name (required)" value="${esc(me.name)}"><textarea id="pb" rows="3" placeholder="Bio">${esc(me.bio)}</textarea>
  <input id="pi" placeholder="Instagram ID" value="${esc(me.insta)}"><p class="mu">ID: @${esc(meId)} · Akhs are managed in the Akhs tab.</p>
  <div class="row"><button id="sv">Save</button><button class="sec" id="lo">Sign out</button></div><p id="pe" class="mu"></p></div>`;
  $('#sv').onclick=async()=>{const n=$('#pn').value.trim();if(!n)return $('#pe').textContent='Name is required';
    Object.assign(me,{name:n,bio:$('#pb').value.trim(),insta:$('#pi').value.trim().replace(/^@/,'')});
    await db.doc('users/'+meId).update({name:me.name,bio:me.bio,insta:me.insta});cache={};$('#pe').textContent='Saved ✓'};
  $('#lo').onclick=()=>{store.set(null);meId=me=null;cache={};auth()};
}
init();
</script></body></html>
